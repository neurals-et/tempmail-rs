[package]
name = "tempmail-rs"
version = "0.1.0"
edition = "2021"
authors = ["NeuralS <team@neurals.et>"]
description = "Fast, async unofficial Temp-Mail SDK and CLI in Rust"
license = "MIT"
repository = "https://github.com/neurals-et/tempmail-rs"
keywords = ["tempmail", "disposable-email", "email-api", "otp", "sdk"]
categories = ["api-bindings", "command-line-utilities", "network-programming"]
readme = "README.md"

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.4", features = ["derive"] }
regex = "1.10"
colored = "2.1"
thiserror = "1.0"

[[bin]]
name = "tempmail"
path = "src/main.rs"

[lib]
name = "tempmail"
path = "src/lib.rs"
